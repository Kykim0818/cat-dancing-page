<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Cat Body -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#ff6b35" stroke="#e55a2b" stroke-width="2"/>

  <!-- Cat Head -->
  <circle cx="100" cy="80" r="40" fill="#ff6b35" stroke="#e55a2b" stroke-width="2"/>

  <!-- Cat Ears -->
  <polygon points="75,50 85,25 95,50" fill="#ff6b35" stroke="#e55a2b" stroke-width="2"/>
  <polygon points="105,50 115,25 125,50" fill="#ff6b35" stroke="#e55a2b" stroke-width="2"/>

  <!-- Inner Ears -->
  <polygon points="78,47 85,30 92,47" fill="#ff8c66"/>
  <polygon points="108,47 115,30 122,47" fill="#ff8c66"/>

  <!-- Cat Eyes -->
  <ellipse cx="88" cy="75" rx="8" ry="12" fill="#2d3436"/>
  <ellipse cx="112" cy="75" rx="8" ry="12" fill="#2d3436"/>

  <!-- Eye Highlights -->
  <ellipse cx="90" cy="72" rx="3" ry="4" fill="#ffffff"/>
  <ellipse cx="114" cy="72" rx="3" ry="4" fill="#ffffff"/>

  <!-- Cat Nose -->
  <polygon points="100,85 95,90 105,90" fill="#e55a2b"/>

  <!-- Cat Mouth -->
  <path d="M 100 90 Q 95 95 90 90" stroke="#2d3436" stroke-width="2" fill="none"/>
  <path d="M 100 90 Q 105 95 110 90" stroke="#2d3436" stroke-width="2" fill="none"/>

  <!-- Cat Whiskers -->
  <line x1="60" y1="80" x2="85" y2="82" stroke="#2d3436" stroke-width="2"/>
  <line x1="60" y1="90" x2="85" y2="88" stroke="#2d3436" stroke-width="2"/>
  <line x1="115" y1="82" x2="140" y2="80" stroke="#2d3436" stroke-width="2"/>
  <line x1="115" y1="88" x2="140" y2="90" stroke="#2d3436" stroke-width="2"/>

  <!-- Cat Legs -->
  <ellipse cx="75" cy="160" rx="8" ry="15" fill="#ff6b35" stroke="#e55a2b" stroke-width="2"/>
  <ellipse cx="95" cy="160" rx="8" ry="15" fill="#ff6b35" stroke="#e55a2b" stroke-width="2"/>
  <ellipse cx="105" cy="160" rx="8" ry="15" fill="#ff6b35" stroke="#e55a2b" stroke-width="2"/>
  <ellipse cx="125" cy="160" rx="8" ry="15" fill="#ff6b35" stroke="#e55a2b" stroke-width="2"/>

  <!-- Cat Paws -->
  <circle cx="75" cy="170" r="6" fill="#2d3436"/>
  <circle cx="95" cy="170" r="6" fill="#2d3436"/>
  <circle cx="105" cy="170" r="6" fill="#2d3436"/>
  <circle cx="125" cy="170" r="6" fill="#2d3436"/>

  <!-- Cat Tail -->
  <path d="M 145 130 Q 170 120 175 100 Q 180 80 170 60" stroke="#e55a2b" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Cat Belly -->
  <ellipse cx="100" cy="125" rx="25" ry="20" fill="#ff8c66"/>

  <!-- Cat Chest -->
  <ellipse cx="100" cy="105" rx="15" ry="10" fill="#ff8c66"/>
</svg>